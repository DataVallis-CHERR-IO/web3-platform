name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - uat
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherrio
          POSTGRES_PASSWORD: cherrio
          POSTGRES_DB: cherrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherrio -d cherrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cherrio:cherrio@localhost:5432/cherrio_test
      DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter='!@cherrio/contracts' lint

      - name: Typecheck
        run: pnpm --filter='!@cherrio/contracts' typecheck

      - name: Test (Vitest)
        run: pnpm --filter='!@cherrio/contracts' test

      - name: Build
        run: pnpm --filter='!@cherrio/contracts' build

  contracts:
    name: Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge Format Check
        working-directory: packages/contracts
        run: forge fmt --check

      - name: Run Forge Build
        working-directory: packages/contracts
        run: forge build

      - name: Run Forge Tests
        working-directory: packages/contracts
        run: forge test -vv
