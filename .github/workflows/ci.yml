name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - uat
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherrio
          POSTGRES_PASSWORD: cherrio
          POSTGRES_DB: cherrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherrio -d cherrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cherrio:cherrio@localhost:5432/cherrio_test
      DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter='!@cherrio/contracts' lint

      - name: Typecheck
        run: pnpm --filter='!@cherrio/contracts' typecheck

      - name: Test (Vitest)
        run: pnpm --filter='!@cherrio/contracts' --filter='!web' --filter='!@cherrio/db' test

      - name: Migrate test DB
        run: pnpm --filter @cherrio/db migrate

      - name: Test web (Vitest, DB-backed)
        run: pnpm --filter web test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test DB integration (Vitest)
        run: pnpm --filter @cherrio/db test:integration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: pnpm --filter='!@cherrio/contracts' build

      - name: Generate design tokens
        run: pnpm --filter @cherrio/ui tokens

      - name: Check tokens drift
        run: |
          git diff --exit-code packages/ui/src/styles/tokens.css \
            || (echo "tokens.css is out of sync — run pnpm --filter @cherrio/ui tokens" && exit 1)

      - name: Design guard
        working-directory: apps/web
        run: pnpm check:design

  e2e:
    name: E2E — a11y + no-Google-Fonts
    runs-on: ubuntu-latest
    needs: typescript
    env:
      APP_ENV: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Build web (and workspace deps, without Solidity)
        run: pnpm --filter 'web...' --filter '!@cherrio/contracts' build

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/e2e/screenshots/
          retention-days: 14

  contracts:
    name: Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge Format Check
        working-directory: packages/contracts
        run: forge fmt --check

      - name: Run Forge Build
        working-directory: packages/contracts
        run: forge build

      - name: Run Forge Tests
        working-directory: packages/contracts
        run: forge test -vv
