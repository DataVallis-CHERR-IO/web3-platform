name: CI

on:
  # Feature branches run CI through their pull request only (once per commit).
  # Pushes to the long-lived branches run only the image build, which fills the
  # build cache that pull requests read from (GitHub Actions minutes, 2026-10-03).
  push:
    branches:
      - dev
      - uat
      - main
  pull_request:
    branches:
      - dev
      - uat
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request changes, so jobs that cannot be affected are skipped.
  # A skipped job counts as passed for required checks.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      contracts: ${{ steps.diff.outputs.contracts }}
      indexer: ${{ steps.diff.outputs.indexer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            files="(push)"
            code=true; contracts=true; indexer=true
          else
            files=$(git diff --name-only "$BASE...$HEAD")
            # Documentation only (docs/ or Markdown files) → nothing to build or test.
            if echo "$files" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
            if echo "$files" | grep -qE '^packages/contracts/|^\.github/workflows/|^\.gitmodules$'; then contracts=true; else contracts=false; fi
            if echo "$files" | grep -qE '^apps/indexer/|^packages/(contracts|db|shared)/|^pnpm-lock\.yaml$|^patches/|^\.github/workflows/'; then indexer=true; else indexer=false; fi
          fi
          echo "$files"
          echo "code=$code contracts=$contracts indexer=$indexer"
          { echo "code=$code"; echo "contracts=$contracts"; echo "indexer=$indexer"; } >> "$GITHUB_OUTPUT"
      # Unit test for the Deploy guard (manual run: branch must match environment).
      - name: Deploy guard tests
        run: bash .github/scripts/check-deploy-target.test.sh

  typescript:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherrio
          POSTGRES_PASSWORD: cherrio
          POSTGRES_DB: cherrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherrio -d cherrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stand-in for Hetzner Object Storage (private files, ADR-033); same image
      # and bucket as docker-compose.dev.yml. The web tests fail if it is missing.
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cherrio-private-local,cherrio-public-local
        ports:
          - 9090:9090
    env:
      DATABASE_URL: postgres://cherrio:cherrio@localhost:5432/cherrio_test
      DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter='!@cherrio/contracts' lint

      - name: Typecheck
        run: pnpm --filter='!@cherrio/contracts' typecheck

      - name: Test (Vitest)
        run: pnpm --filter='!@cherrio/contracts' --filter='!web' --filter='!@cherrio/db' --filter='!worker' test

      - name: Migrate test DB
        run: pnpm --filter @cherrio/db migrate

      - name: Test web (Vitest, DB- and s3mock-backed)
        run: pnpm --filter web test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # TASK-033e: the worker's points, queue and sender run against Postgres (migrated above).
      - name: Test worker (Vitest, DB-backed)
        run: pnpm --filter worker test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Test DB integration (Vitest)
        run: pnpm --filter @cherrio/db test:integration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # TASK-047: the campaign lists, landing, campaign page and "My donations"
      # with 10,000 published campaigns (100,000 donors) must stay within their
      # budgets (apps/web/src/__perf__/campaign-lists.perf.ts). Own database:
      # the web tests count rows in cherrio_test.
      - name: Campaign list speed (10,000 campaigns)
        run: |
          PGPASSWORD=cherrio psql -h localhost -U cherrio -d cherrio_test -c "create database cherrio_perf"
          pnpm --filter @cherrio/db migrate
          pnpm --filter web perf:campaigns
        env:
          DATABASE_URL: postgres://cherrio:cherrio@localhost:5432/cherrio_perf
          DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_perf

      - name: Build
        run: pnpm --filter='!@cherrio/contracts' build

      - name: Generate design tokens
        run: pnpm --filter @cherrio/ui tokens

      - name: Check tokens drift
        run: |
          git diff --exit-code packages/ui/src/styles/tokens.css \
            || (echo "tokens.css is out of sync — run pnpm --filter @cherrio/ui tokens" && exit 1)

      - name: Design guard
        working-directory: apps/web
        run: pnpm check:design

  e2e:
    name: E2E — a11y, no-Google-Fonts, organisation onboarding
    runs-on: ubuntu-latest
    needs: typescript
    # The logged-in tests need the database and the object-storage stand-in.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherrio
          POSTGRES_PASSWORD: cherrio
          POSTGRES_DB: cherrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherrio -d cherrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cherrio-private-local,cherrio-public-local
        ports:
          - 9090:9090
    env:
      # local, never dev: the server accepts a localhost origin only in `local`.
      APP_ENV: local
      DATABASE_URL: postgres://cherrio:cherrio@localhost:5432/cherrio_test
      DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Build web (and workspace deps, without Solidity)
        run: pnpm --filter 'web...' --filter '!@cherrio/contracts' build

      - name: Migrate test DB
        run: pnpm --filter @cherrio/db migrate

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/e2e/screenshots/
          retention-days: 14

  contracts:
    name: Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.contracts == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge Format Check
        working-directory: packages/contracts
        run: forge fmt --check

      - name: Run Forge Build
        working-directory: packages/contracts
        run: forge build

      - name: Run Forge Tests
        working-directory: packages/contracts
        run: forge test -vv

  indexer:
    name: Indexer scenario
    runs-on: ubuntu-latest
    needs: [changes, typescript]
    if: needs.changes.outputs.indexer == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherrio
          POSTGRES_PASSWORD: cherrio
          POSTGRES_DB: cherrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherrio -d cherrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Direct Postgres (no PgBouncer). The scenario test creates and drops its own
      # database, so this role must be allowed to CREATE DATABASE.
      DATABASE_URL_DIRECT: postgres://cherrio:cherrio@localhost:5432/cherrio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Indexer unit tests
        run: pnpm --filter indexer test

      # Anvil + DeployAmoy.s.sol + Ponder + Postgres. Fails (never skips) if
      # anvil, forge or the database is missing.
      - name: Indexer scenario test
        run: pnpm --filter indexer test:scenario

  # Builds both images the way the deploy workflow does, without pushing them,
  # so an image that cannot be built is found before the merge (TASK-028).
  # Runs on PRs that change code, and on pushes to dev, uat and main — those
  # runs fill the cache that PR builds read from.
  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile
            scope: ci-web
            load: true
          - image: indexer
            dockerfile: Dockerfile.indexer
            scope: ci-indexer
            load: false
          - image: worker
            dockerfile: Dockerfile.worker
            scope: ci-worker
            load: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Short SHA
        id: meta
        run: echo "sha7=$(echo "${{ github.sha }}" | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache scopes are separate from the deploy workflow's, so a CI build never
      # replaces what a deploy relies on. Each Dockerfile uses only its own
      # build arg; Docker reports the other one as "not consumed".
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.load }}
          tags: cherrio-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          build-args: |
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            GIT_SHA7=${{ steps.meta.outputs.sha7 }}

      # The bundled storage commands must load inside the image. Without a
      # command the script prints its usage and exits 1; a bundle that cannot
      # be loaded prints a stack trace instead.
      # The worker bundle must load in its image: without DATABASE_URL it stops
      # with this exact message; a bundle that cannot load prints a stack trace instead.
      - name: Worker bundle loads (worker)
        if: matrix.image == 'worker'
        run: |
          OUT=$(docker run --rm cherrio-worker:ci 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -qF 'DATABASE_URL is required' || { echo "::error::the worker bundle did not load"; exit 1; }

      - name: Bundled scripts and sharp load (web)
        if: matrix.image == 'web'
        run: |
          OUT=$(docker run --rm cherrio-web:ci node apps/web/dist/files.mjs 2>&1 || true)
          echo "$OUT"
          if ! echo "$OUT" | grep -qF 'Usage: files check | files sweep [--dry-run]'; then
            echo "::error::apps/web/dist/files.mjs did not print its usage — the bundle does not load in the image."
            exit 1
          fi
          # sharp (cover images, ADR-037) ships a native binary per platform; it must load in this image.
          docker run --rm -w /app/apps/web cherrio-web:ci node -e "require('sharp'); console.log('sharp loads')"
