name: GHCR clean-up

# Manual only ("Run workflow"). Keeps the 20 newest deploy images per package
# (sha-<7>), every deploy image of a main/uat commit, anything tagged otherwise,
# tested/untagged images from the last 21 days and every child of a kept image; deletes the
# rest (older deploy images with their children, old tested tree-* images, old
# untagged leftovers). The cherrio-site package is never touched.
# Without "apply" it only lists what it would delete (see the run's notices).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete (unticked = dry run, only list)"
        type: boolean
        default: false

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read   # main/uat commits (their deploy images are kept)
  actions: read    # successful and running Deploy runs
  packages: write

jobs:
  cleanup:
    name: Clean up ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [cherrio/web, cherrio/worker, cherrio/indexer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            bash .github/scripts/ghcr-cleanup.sh "${GITHUB_REPOSITORY_OWNER}" "$PACKAGE" --apply
          else
            bash .github/scripts/ghcr-cleanup.sh "${GITHUB_REPOSITORY_OWNER}" "$PACKAGE"
          fi
