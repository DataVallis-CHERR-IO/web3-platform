name: GHCR clean-up

# Manual only ("Run workflow"). Deletes old images of superseded PR pushes —
# versions whose every tag starts with "tree-" (build once, PR #183) — older
# than 7 days and not referenced by a recent deploy. Deploy tags (sha-*),
# untagged versions and the cherrio-site package are never touched.
# Without "apply" it only lists what it would delete (see the run's notices).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete (unticked = dry run, only list)"
        type: boolean
        default: false

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Clean up ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cherrio/web, cherrio/worker, cherrio/indexer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            bash .github/scripts/ghcr-cleanup.sh "${GITHUB_REPOSITORY_OWNER}" "$PACKAGE" --apply
          else
            bash .github/scripts/ghcr-cleanup.sh "${GITHUB_REPOSITORY_OWNER}" "$PACKAGE"
          fi
