# config/deploy.dev.yml
# Kamal 2 destination: dev  (git branch: dev, chain: Polygon Amoy)
# Usage: kamal deploy -d dev
#
# Scope: web app only. Indexer, worker, Redis arrive in later tasks.
# Domain: dev.cherr.io
# Memory limits per Architecture §5 budget table.
# Note: noindex header restricts public access.

service: cherrio-web-dev

servers:
  web:
    hosts:
      - 49.13.63.71
    options:
      memory: 384m
    # indexer/worker roles added in TASK-006

proxy:
  ssl: true
  host: dev.cherr.io

env:
  clear:
    APP_ENV: dev
    NODE_ENV: production
    PRIVY_APP_ID: cmup9dfcd00ct0cjsvqkzm9q9
    # Private file storage (ADR-033): Hetzner Object Storage, one private bucket per environment
    S3_ENDPOINT: https://nbg1.your-objectstorage.com
    S3_REGION: nbg1
    S3_BUCKET: cherrio-private-dev
    # Public campaign media (ADR-037): public-read bucket, same storage account
    S3_PUBLIC_BUCKET: cherrio-public-dev
    S3_PUBLIC_BASE_URL: https://cherrio-public-dev.nbg1.your-objectstorage.com
    # Card top-up (ADR-051, TASK-036b): Privy's sandbox flow (Stripe test card 4242…);
    # nothing arrives on Amoy, so the faucet stays next to it. Never "production" on a test network.
    FUNDING_ONRAMP: sandbox
  secret:
    - DATABASE_URL            # cherrio-infra-pgbouncer-1:6432/cherrio_dev
    - DATABASE_URL_DIRECT     # cherrio-infra-postgres-1:5432/cherrio_dev
    - PRIVY_APP_SECRET
    - SESSION_SECRET
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - PRIVATE_FILES_KEY       # AES-256 key for private files; if lost, stored files are unreadable
    - FAL_KEY                 # fal.ai, demo campaign covers only (ADR-052, TASK-038b)
