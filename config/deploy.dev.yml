# config/deploy.dev.yml
# Kamal 2 destination: dev  (git branch: dev, chain: Polygon Amoy)
# Usage: kamal deploy -d dev
#
# Scope: web app only. Indexer, worker, Redis arrive in later tasks.
# Domain: dev.cherr.io
# Memory limits per Architecture §5 budget table.
# Note: noindex header restricts public access.

service: cherrio-web-dev

servers:
  web:
    hosts:
      - 49.13.63.71
    options:
      memory: 384m
    # indexer/worker roles added in TASK-006

proxy:
  ssl: true
  host: dev.cherr.io

env:
  clear:
    APP_ENV: dev
    NODE_ENV: production
  secret:
    - DATABASE_URL            # cherrio-infra-pgbouncer-1:6432/cherrio_dev
    - DATABASE_URL_DIRECT     # cherrio-infra-postgres-1:5432/cherrio_dev
