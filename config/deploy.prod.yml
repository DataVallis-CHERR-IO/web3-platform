# config/deploy.prod.yml
# Kamal 2 destination: prod  (git branch: main, chain: Polygon mainnet)
# Usage: kamal deploy -d prod   (workflow_dispatch only — no auto-deploy)
#
# Scope: web app only. Indexer, worker, MCP, Redis arrive in later tasks.
# Domains: cherr.io (+ app.cherr.io, api.cherr.io — commented until go-live)
# Data: REAL production data — double-check before any manual commands.

service: cherrio-web-prod

servers:
  web:
    hosts:
      - 49.13.63.71
    options:
      memory: 768m
    # indexer/worker/mcp roles added in later tasks

proxy:
  ssl: true
  host: cherr.io
  # Additional hosts enabled at go-live:
  # hosts:
  #   - cherr.io
  #   - app.cherr.io
  #   - api.cherr.io

env:
  clear:
    APP_ENV: prod
    NODE_ENV: production
  secret:
    - DATABASE_URL            # cherrio-infra-pgbouncer-1:6432/cherrio_prod
    - DATABASE_URL_DIRECT     # cherrio-infra-postgres-1:5432/cherrio_prod
