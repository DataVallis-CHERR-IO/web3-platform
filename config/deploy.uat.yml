# config/deploy.uat.yml
# Kamal 2 destination: uat  (git branch: uat, chain: Polygon Amoy)
# Usage: kamal deploy -d uat
#
# Scope: web app only. Indexer, worker, Redis arrive in later tasks.
# Domain: uat.cherr.io
# Data: seed + test data — NEVER real personal data from prod.
# Note: noindex header restricts public access.

service: cherrio-web-uat

servers:
  web:
    hosts:
      - 49.13.63.71
    options:
      memory: 384m
    # indexer/worker roles added in TASK-006

proxy:
  ssl: true
  host: uat.cherr.io

env:
  clear:
    APP_ENV: uat
    NODE_ENV: production
  secret:
    - DATABASE_URL            # cherrio-infra-pgbouncer-1:6432/cherrio_uat
    - DATABASE_URL_DIRECT     # cherrio-infra-postgres-1:5432/cherrio_uat
