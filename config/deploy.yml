# config/deploy.yml
# Kamal 2 base configuration — shared across all destinations.
# NEVER deploy with this file alone. Always use a destination:
#   kamal deploy -d dev   (reads this file + config/deploy.dev.yml)
#   kamal deploy -d uat
#   kamal deploy -d prod
#
# Scope: web app only. Indexer, worker, MCP, and Redis arrive in later tasks.

# Primary service. Each destination overrides `service` with an env suffix
# (cherrio-web-dev, cherrio-web-uat, cherrio-web-prod) so all three coexist
# on the same host without name collisions.
service: cherrio-web
image: datavallis-cherr-io/cherrio/web

servers:
  web:
    - 49.13.63.71

# kamal-proxy terminates TLS via Let's Encrypt and routes by Host header.
# `host` is overridden per destination.
proxy:
  ssl: true
  host: placeholder.cherr.io
  app_port: 3000
  buffering:
    requests: false
    responses: true
    memory: 2_000_000
  response_timeout: 30
  healthcheck:
    path: /api/health
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  keys_only: true

# Images are built in GitHub Actions (CI) and pushed to GHCR.
# Kamal only pulls — never builds on the server.
builder:
  arch: amd64
  remote: false

boot:
  limit: 10
  wait: 2

# Keep last 3 container images per service on the host.
retain_containers: 3

logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Secrets resolved from .kamal/secrets (reads GitHub Environment variables in CI).
# App-specific env vars are in destination files.
# NOTE: KAMAL_REGISTRY_PASSWORD is used only in registry.password above.
# Do not add it to env.secret — it must never reach app containers.
