# config/indexer.yml
# Kamal 2 base configuration for the Ponder indexer (apps/indexer) — a separate
# service from the web app (config/deploy.yml). Always use a destination:
#   kamal deploy -c config/indexer.yml -d dev   (reads this file + config/indexer.dev.yml)
#
# The indexer has NO proxy route and NO published port: it is reachable only on
# the `kamal` Docker network. Each destination sets the service name
# (cherrio-indexer-dev, …) so all environments coexist on one host.
service: cherrio-indexer
image: datavallis-cherr-io/cherrio/indexer

primary_role: indexer

servers:
  indexer:
    hosts:
      - 49.13.63.71
    proxy: false

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  keys_only: true

# Images are built in GitHub Actions (CI) and pushed to GHCR.
builder:
  arch: amd64
  remote: false

# Without a proxy Kamal waits for the image's HEALTHCHECK (/health) to report
# healthy, then stops the previous version (kamal-2.12.0 lib/kamal/cli/app/boot.rb).
# /ready (backfill finished) is checked by the deploy job.
deploy_timeout: 120

# Keep the previous image and container for `kamal rollback`.
retain_containers: 3

logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
