# config/worker.dev.yml
# Kamal 2 destination: dev (git branch: dev). Usage: kamal deploy -c config/worker.yml -d dev
#
# uat/prod: copy this file to worker.<env>.yml and change the service name,
# APP_ENV and APP_BASE_URL (prod: https://app.cherr.io). No code change is needed.

service: cherrio-worker-dev

servers:
  worker:
    hosts:
      - 49.13.63.71
    proxy: false
    options:
      # Architecture §5 memory budget: worker dev/uat 192 MB.
      memory: 192m

env:
  clear:
    APP_ENV: dev
    APP_BASE_URL: https://dev.cherr.io
    NODE_OPTIONS: --max-old-space-size=128
    # ADR-048: Data Vallis mail server; host, port and sender are not secrets.
    SMTP_HOST: mail.datavallis.com
    SMTP_PORT: "587"
    MAIL_FROM: "CHERR.IO <hello@cherr.io>"
  secret:
    # The web app's role through PgBouncer (the worker writes app.* only and reads chain.* views).
    - DATABASE_URL
    # SMTP_USER and SMTP_PASSWORD are added here once David has put their names in
    # .kamal/secrets-common and their values in the GitHub Environment (Kamal refuses a
    # secret name it cannot resolve). Until then sending is off; points and queueing run.
