services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cherrio-postgres-dev
    environment:
      POSTGRES_USER: cherrio
      POSTGRES_PASSWORD: cherrio
      POSTGRES_DB: cherrio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherrio -d cherrio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cherrio-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local stand-in for Hetzner Object Storage (private files, ADR-033).
  # Loopback only. It accepts any credentials and keeps nothing after a restart,
  # so it is for development and tests only.
  s3mock:
    image: adobe/s3mock:5.2.3
    container_name: cherrio-s3mock-dev
    environment:
      # private files (ADR-033) and public campaign media (ADR-037)
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cherrio-private-local,cherrio-public-local
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
  redis_data:
