services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cherrio-postgres-dev
    environment:
      POSTGRES_USER: cherrio
      POSTGRES_PASSWORD: cherrio
      POSTGRES_DB: cherrio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherrio -d cherrio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cherrio-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
