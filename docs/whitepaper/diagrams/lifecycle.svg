<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 250" role="img" aria-label="Campaign lifecycle" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#090c0d">
  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#090c0d"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g fill="none" stroke="#090c0d" stroke-width="2.5">
    <path d="M98 68H128" marker-end="url(#lc-arrow)"/>
    <path d="M262 68H318" marker-end="url(#lc-arrow)"/>
    <path d="M452 68H488" marker-end="url(#lc-arrow)"/>
    <path d="M197 96V166" marker-end="url(#lc-arrow)"/>
    <path d="M564 110V166" marker-end="url(#lc-arrow)"/>
    <path d="M528 90V138H387V166" marker-end="url(#lc-arrow)"/>
  </g>

  <!-- row A -->
  <rect x="6" y="44" width="92" height="56" fill="#090c0d"/>
  <rect x="2" y="40" width="92" height="56" fill="#fff" stroke="#090c0d" stroke-width="3"/>
  <text x="48" y="73" text-anchor="middle" font-weight="700" fill="#090c0d">Draft</text>

  <rect x="136" y="44" width="130" height="56" fill="#090c0d"/>
  <rect x="132" y="40" width="130" height="56" fill="#fff" stroke="#090c0d" stroke-width="3"/>
  <text x="197" y="73" text-anchor="middle" font-weight="700" fill="#090c0d">Team review</text>

  <rect x="326" y="44" width="130" height="56" fill="#090c0d"/>
  <rect x="322" y="40" width="130" height="56" fill="#fff" stroke="#090c0d" stroke-width="3"/>
  <text x="387" y="65" text-anchor="middle" font-weight="700" fill="#090c0d">Live</text>
  <text x="387" y="83" text-anchor="middle" font-size="11" fill="#525b5c">donations open</text>

  <polygon points="492,70 564,28 636,70 564,112" fill="#fff" stroke="#090c0d" stroke-width="3"/>
  <text x="564" y="66" text-anchor="middle" font-weight="700" font-size="12" fill="#090c0d">At least 10%</text>
  <text x="564" y="81" text-anchor="middle" font-size="10.5" fill="#090c0d">raised at the end?</text>

  <text x="290" y="56" text-anchor="middle" font-size="10" fill="#525b5c">approved</text>
  <text x="207" y="140" font-size="11" fill="#525b5c">rejected</text>
  <text x="574" y="146" font-size="11" font-weight="700" fill="#090c0d">yes</text>
  <text x="458" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#090c0d">no</text>

  <!-- row B -->
  <rect x="136" y="174" width="130" height="60" fill="#090c0d"/>
  <rect x="132" y="170" width="130" height="60" fill="#e3e3e3" stroke="#090c0d" stroke-width="3"/>
  <text x="197" y="205" text-anchor="middle" font-weight="700" fill="#090c0d">Rejected</text>

  <rect x="319" y="174" width="144" height="60" fill="#090c0d"/>
  <rect x="315" y="170" width="144" height="60" fill="#fff" stroke="#090c0d" stroke-width="3"/>
  <text x="387" y="196" text-anchor="middle" font-weight="700" fill="#090c0d">Failed</text>
  <text x="387" y="214" text-anchor="middle" font-size="11" fill="#525b5c">refund or Emergency Pool</text>

  <rect x="498" y="174" width="180" height="60" fill="#090c0d"/>
  <rect x="494" y="170" width="180" height="60" fill="#ff0052" stroke="#090c0d" stroke-width="3"/>
  <text x="584" y="196" text-anchor="middle" font-weight="800" fill="#090c0d">Succeeded</text>
  <text x="584" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#090c0d">payout to the beneficiary</text>
</svg>
