# infra/shared/compose.yml
# Project: cherrio-infra
# Shared infrastructure layer (Postgres, PgBouncer, monitoring, backups).
# Deploy path on server: /opt/cherrio/infra/shared/compose.yml  (via sync.sh)
# Secrets:               /opt/cherrio/secrets/infra.env  (mode 600, never in repo)
# Run:  cd /opt/cherrio/infra/shared
#       docker compose --env-file /opt/cherrio/secrets/infra.env up -d
# Note: ensure-databases.sh must be run before first `docker compose up`
#       to generate /opt/cherrio/infra/pgbouncer/ config files.
# Note: Ponder (apps/indexer) connects directly to postgres:5432, not pgbouncer,
#       because it uses session-mode features (LISTEN/NOTIFY).

name: cherrio-infra

networks:
  kamal:
    external: true   # Created by Kamal on first deploy; create manually if needed:
                     # docker network create kamal

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ────────────────────────────────────────────────────────────
  # Postgres 16 + pgvector
  # shared_buffers sized for 8 GB host (≈25% of RAM)
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1.5g
    # env_file injects ALL variables from infra.env into the container,
    # making POSTGRES_DEV/UAT/PROD_PASSWORD and PGBOUNCER_ADMIN_PASSWORD
    # available to the initdb scripts on first start.
    # Override INFRA_ENV_FILE for local testing (e.g. CI stub).
    env_file: ${INFRA_ENV_FILE:-/opt/cherrio/secrets/infra.env}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command: >-
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
      -c log_timezone=UTC
      -c datestyle=iso,mdy
    # Loopback only — access via SSH tunnel:
    #   ssh -L 5432:127.0.0.1:5432 deploy@49.13.63.71
    # Then connect TablePlus to localhost:5432.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # PgBouncer — transaction pooling
  # Config generated by ensure-databases.sh into
  # /opt/cherrio/infra/pgbouncer/ (mounted read-only).
  # Apps: connect to pgbouncer:6432
  # Ponder: connect directly to postgres:5432 (session features)
  # ────────────────────────────────────────────────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer:1.23.1
    restart: unless-stopped
    mem_limit: 64m
    # Bypass the image's entrypoint (which requires DATABASES_HOST env var)
    # and run pgbouncer directly with our pre-generated config file.
    entrypoint: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/cherrio/infra/pgbouncer:/etc/pgbouncer:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # Prometheus — 15-day retention
  # ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 384m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # node-exporter — host metrics
  # ────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # cAdvisor — container metrics
  # ────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: 128m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # Grafana — published on loopback only; access via SSH tunnel:
  #   ssh -L 3000:127.0.0.1:3000 deploy@49.13.63.71
  # ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # Loki — log aggregation, 7-day retention
  # ────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.1
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kamal

  # ────────────────────────────────────────────────────────────
  # Promtail — scrapes Docker container logs → Loki
  # ────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.3.1
    restart: unless-stopped
    mem_limit: 96m
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    networks:
      - kamal
