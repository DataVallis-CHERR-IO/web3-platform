global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    host: cherrio-1

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: cherrio-1

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Drop high-cardinality per-CPU metrics to save space
      - source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total'
        action: drop
