server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Docker container logs via JSON log files
  # Scrapes /var/lib/docker/containers/<id>/<id>-json.log
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: cherrio-1
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log:    log
            stream: stream
            time:   time
            tag:    attrs.tag
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log
      # Extract container name from the file path tag
      - regex:
          expression: '(?P<container_name>[^/]+)/[^/]+-json\.log$'
          source: filename
      - labels:
          container_name:

  # Host systemd journal (optional; requires /var/log bind mount)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: cherrio-1
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<host>\S+) (?P<program>[^:]+): (?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: Jan 2 15:04:05
      - labels:
          host:
          program:
      - output:
          source: message
